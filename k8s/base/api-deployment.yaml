apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-api
  template:
    metadata:
      labels:
        app: retail-api
    spec:
      containers:
        - name: api
          image: retail-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: outputs
              mountPath: /app/outputs
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
      volumes:
        - name: outputs
          hostPath:
            path: /repo/outputs
            type: Directory
