[project]
name = "retail-ds"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "duckdb>=1.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "implicit>=0.7",
    "mlxtend>=0.23",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "mlflow>=2.14",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "tqdm>=4.66",
    "pyyaml>=6.0"
]
[tool.ruff.lint.per-file-ignores]
# OPENBLAS_NUM_THREADS must be set before implicit imports, so imports follow it
"src/retail_ds/features/design_matrix.py" = ["E402"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]